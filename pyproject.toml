[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-agentic-model"
version = "0.3.0"
description = "Auditable, non-commercial credit-default benchmark research"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2", "pandas>=2.2", "scikit-learn>=1.6", "catboost>=1.2.8",
  "lightgbm>=4.6", "joblib>=1.4", "requests>=2.32", "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
credit-risk = "creditrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
