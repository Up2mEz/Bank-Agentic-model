name: Python checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-core.txt -r requirements-dev.txt -e .
      - run: python -m pip install -e './agent_app[dev]'
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: ruff check agent_app
      - run: ruff format --check agent_app
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test agent_app/tests/wallet_final_ui.test.cjs
