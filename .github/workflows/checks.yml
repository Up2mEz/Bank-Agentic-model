name: Python checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-core.txt -r requirements-dev.txt -e .
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
      - run: python -m pytest -q
