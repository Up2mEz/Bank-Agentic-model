[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "merchant-agent-app"
version = "0.1.0"
description = "Evidence-based merchant lending review application and local agent experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32", "pillow>=11,<13", "pypdf>=6,<7", "pypdfium2>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "reportlab>=4,<5"]

[project.scripts]
merchant-agent = "merchant_sandbox.server:main"
merchant-agent-review = "merchant_sandbox.review_api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
merchant_sandbox = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["historical_replay: requires the original immutable local experiment artifacts"]

[tool.ruff]
extend = "../pyproject.toml"
